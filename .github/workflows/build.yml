name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list is "tools platform-tools", and the legacy "tools"
          # package was removed from the SDK repository long ago, so sdkmanager fails with
          # "Failed to find package 'tools'" and the whole job stops before Gradle ever runs.
          # Name the packages this build needs instead.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and assemble
        run: ./gradlew --no-daemon --stacktrace test lint assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-calendar-export-import-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
